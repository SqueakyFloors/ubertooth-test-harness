name: Test

on:
  # Branch pushes are covered by their pull_request run; pushing to main runs
  # once after merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The checks live in scripts/ci.sh so they also run off GitHub
  # (scripts/local-ci.sh); keep this file to runner setup only.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Test
      run: sh scripts/ci.sh test

  build:
    # Real out-of-tree build of the fork's host tools into a run prefix.
    # Firmware is not built here (no ARM toolchain on the runners).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake pkg-config libusb-1.0-0-dev libbluetooth-dev libfftw3-dev

    - name: Build dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install libusb pkg-config fftw

    - name: Build
      run: sh scripts/ci.sh build
