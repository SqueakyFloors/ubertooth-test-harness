resources:
  Host_Linux:
    type: Host
    platform: linux
    roles: [controller, test target]
    defaults:
      Ubertooth: UT_Linux0
      # Role-named defaults pick which DK takes which role; the plain type
      # default is the advertiser.
      nRF52840 DK: DK_Linux0
      central: DK_Linux1
      peripheral: DK_Linux2

  Host_Mac:
    type: Host
    platform: macos
    roles: [test target]
    defaults:
      Ubertooth: UT_Mac0

  UT_Linux0:
    type: Ubertooth
    attached to: Host_Linux
    identity:
      serial: REPLACE_WITH_UBERTOOTH_SERIAL
    power:
      controller: Hub_Linux0
      port: 1

  UT_Linux1:
    type: Ubertooth
    attached to: Host_Linux
    identity:
      serial: REPLACE_WITH_SECOND_UBERTOOTH_SERIAL
    power:
      controller: Hub_Linux0
      port: 3

  UT_Mac0:
    type: Ubertooth
    attached to: Host_Mac
    identity:
      serial: REPLACE_WITH_MAC_UBERTOOTH_SERIAL

  # nRF52840 DKs (PCA10056) running the harness role firmware
  # (firmware/nrf52840dk). Identify each by its on-board J-Link serial, as
  # `nrfutil device list` prints it (quote it to keep leading zeros). The
  # advertiser's BLE address is the static random address its `status`
  # reports (derived from the chip's FICR, stable per board). VCOM0 is found
  # by J-Link serial (/dev/serial/by-id on Linux); set `serial device` to
  # override it. `power` maps the DK's interface USB to a hub port.
  DK_Linux0:
    type: nRF52840 DK
    attached to: Host_Linux
    roles: [advertiser]
    identity:
      jlink serial: "000123456789"
      BLE address: "C0:00:00:00:00:01"
    power:
      controller: Hub_Linux1
      port: 4

  # The connection pair: these two connect to each other while the Ubertooth
  # follows them. Both need a BLE address, because the central connects to
  # the peripheral's and the capture is checked against both.
  DK_Linux1:
    type: nRF52840 DK
    attached to: Host_Linux
    roles: [central]
    identity:
      jlink serial: "000123456790"
      BLE address: "C0:00:00:00:00:02"
    power:
      controller: Hub_Linux1
      port: 5

  DK_Linux2:
    type: nRF52840 DK
    attached to: Host_Linux
    roles: [peripheral]
    identity:
      jlink serial: "000123456791"
      BLE address: "C0:00:00:00:00:03"
    power:
      controller: Hub_Linux1
      port: 6

  # StarTech managed hub: switched through its built-in FTDI management
  # controller, which sits on downstream port 4; only ports 1-3 are DUT ports.
  # Use the stable /dev/serial/by-id path (required). Needs pyserial, see
  # requirements.txt. Only the factory password is supported. uhubctl cannot
  # cut power on this hub.
  Hub_Linux0:
    type: USB power controller
    attached to: Host_Linux
    identity:
      serial device: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_REPLACE-if00-port0
    driver: startech managed USB hub
    capabilities:
      - per-port VBUS switching

  # Alternative: Acroname USBHub3+ (ports 0-7, with power/VBUS readback).
  # To use it, point the Ubertooth power mappings at Hub_Linux1.
  Hub_Linux1:
    type: USB power controller
    attached to: Host_Linux
    identity:
      serial: "0xREPLACE_WITH_ACRONAME_SERIAL"
    driver: acroname BrainStem USBHub3+
    capabilities:
      - per-port VBUS switching
      - per-port data switching
      - power readback
      - VBUS voltage measurement
      - VBUS current measurement
