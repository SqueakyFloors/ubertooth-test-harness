# Role firmware for the harness's nRF52840 DK test devices.
# SPDX-License-Identifier: Apache-2.0

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="utdk"
# The advertiser's ADV_IND and the peripheral role need BT_PERIPHERAL; the
# central role connects to a known address without scanning.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=1
# No pairing: a test device is open, and pairing would add packets no test
# asks for.
CONFIG_BT_SMP=n
# The central writes to the peripheral's one characteristic, which it finds
# by UUID.
CONFIG_BT_GATT_CLIENT=y

# Data Length Extension up to the 251-byte maximum, and an ATT MTU that fills
# it (3 bytes of ATT header and 4 of L2CAP header in a 251-byte packet).
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# Only the 1M PHY is built in, so a connection can never move off it; the
# PHY update API is kept so status can report which PHY is in use.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_USER_PHY_UPDATE=y

# Line-based shell on uart0 (the J-Link VCOM0 port): no colors, no echo,
# no prompt, so every line the harness reads is a response.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_HELP=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_STACK_SIZE=3072
# Only the harness's commands.
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_SHELL_CMDS=n
CONFIG_BT_SHELL=n

# Nothing but responses (and the boot banner) on the console.
CONFIG_LOG=n
