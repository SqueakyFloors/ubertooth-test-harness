# A second image of the same roles whose connections use Bluetooth Channel
# Selection Algorithm #1, for tests of `ubertooth-btle -p`, which recovers
# algorithm 1 connections only. See README.md, "Channel selection algorithm 1".
# SPDX-License-Identifier: Apache-2.0

# Zephyr's own link layer, because it is the one that can be built without
# algorithm 2: the nRF Connect SDK's default SoftDevice Controller always has
# it and offers no way to turn it off. Which link layer is built is settled in
# chan-sel-1.overlay, which this fragment goes with; these two lines then turn
# algorithm 2 off in it.
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
