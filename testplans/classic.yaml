plan: Classic Bluetooth piconet capture
suites:
  # Needs a Linux host with an Ubertooth and two ESP32 Classic peers
  # registered with the acceptor and initiator roles and their BD_ADDRs
  # (hardware.example.yaml). The two peers hold a Serial Port Profile link
  # and stream over it; the Ubertooth only receives. The peers must already
  # run firmware/esp32-classic-peer utesp-1.0.0 or a later 1.x image: unlike
  # the DK cases, nothing here flashes them, and a board running something
  # older fails mandatory preflight with the version it reports. Other
  # registered Ubertooths on the host are guarded (read only).
  #
  # 25 s per capture is what the bench needs for a useful count: the
  # Ubertooth sweeps 79 channels and decodes about one packet of the piconet
  # a second.
  classic:
    - Capture known Classic device:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

    - Classic capture record fields:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

    # Two minutes per capture, which is what the channel map needs rather
    # than what the link does: the Ubertooth has to meet the piconet on
    # every channel the map keeps, and the bench found all 40 of a
    # 40-channel map inside a minute. Two minutes gives that margin and two
    # whole minutes of the per-minute series.
    - Recover AFH map:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 2m

  classic-comprehensive:
    - Capture known Classic device:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s

    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s

    # The comprehensive profile adds the audio link, which needs the peers
    # on utesp-1.5.0 or a later 1.x image, and a survey.
    - Classic capture record fields:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s

    # Two minutes per capture, which is what the channel map needs rather
    # than what the link does: the Ubertooth has to meet the piconet on
    # every channel the map keeps, and the bench found all 40 of a
    # 40-channel map inside a minute. Two minutes gives that margin and two
    # whole minutes of the per-minute series.
    - Recover AFH map:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 2m

  # The bounded long variant: the same two smoke cases over a capture long
  # enough to show that a receive run holds up, rather than that it starts.
  # Two captures of five minutes each, so about eleven minutes with the
  # bring-ups; the boards are held throughout. It is not a soak with
  # sampling: `Classic Bluetooth receive soak` is still a backlog entry, and
  # the sampling is what it is waiting for.
  classic-long:
    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 5m

  # The alternate firmware image, end to end. It writes the board's firmware,
  # so it is the only test in this suite: a test after it would run on an
  # image this one put there, which mandatory preflight refuses. One
  # flash-and-session cycle, about a minute, and the cleanup always writes
  # `bluetooth_rxtx` back.
  #
  # The run has to carry both firmware images and the Python tools, because
  # `ubertooth-btbr` is one of them: `run-suite --build --with-firmware
  # --with-python`. Passing the images by hand works too
  # (`--artifact "btbr build=PATH" --artifact "test build=PATH"`), but the
  # tool still needs `--with-python`, and without either the case is left out
  # as not applicable rather than failing.
  #
  # This suite is release coverage as well: it is the only test of
  # `ubertooth-btbr` and of the `btbr` image, and `testplans/release.yaml`
  # cannot hold it, because it needs both firmware images and the Python
  # tools, and nothing may run on its board after it. Run it alongside the
  # release plan.
  btbr:
    - Classic btbr console:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        allow RF transmission: true
        coverage: smoke

  # Comprehensive adds the page nothing answers, which costs the firmware's
  # whole 45 s page attempt.
  btbr-comprehensive:
    - Classic btbr console:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        allow RF transmission: true
        coverage: comprehensive

  # The repetition suite: five flash-and-session cycles, about five minutes,
  # so a flash that only works the first time or a page that only connects
  # once shows up. Ten firmware writes, so it holds the board throughout.
  btbr-long:
    - Classic btbr console:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        allow RF transmission: true
        coverage: smoke
        sessions: 5

  # The Classic weak-link entries #168 asked for, each at the attenuation a
  # run has characterized. Measured 2026-11-02 in the attenuated device
  # sweep, with the ESP32 pair streaming and one firmware revision across
  # every board compared. Each entry is the committed test pointed at a
  # weak-link receiver; no threshold is changed.
  #
  # `ubertooth-rx -l <LAP> -u <UAP> -e N -t 25` per leg, interleaved:
  #
  #        | packets | clock acquired | RSSI mean | err=0 share
  #   -e 0 |    1793 | yes            |     -52.3 | 100%          (20 dB)
  #   -e 2 |    2692 | yes            |     -52.3 |  77%          (20 dB)
  #   -e 0 |     880 | yes            |     -66.3 | 100%          (40 dB)
  #   -e 2 |    2388 | yes            |     -66.7 |  74%          (40 dB)
  #   -e 4 |    2376 | yes            |     -67.3 |  63%          (40 dB)
  #
  # Every decoded packet in all nine legs carried the target LAP and no leg
  # carried another, the supplied UAP was used rather than guessed, and `-e`
  # was honoured exactly (an `-e 0` leg holds err=0 and nothing else).
  #
  # Two things that shaped which entry sits at which attenuation:
  #
  #  * 40 dB is not an error regime here: its error profile is close to
  #    20 dB's on a comparable packet count. So the `-e` entry is at 40 dB
  #    because that is the weakest link measured, not because it produces
  #    damaged packets in quantity.
  #  * at 20 dB, `-e 4` collapsed to 1 and then 5 packets, minutes after the
  #    same board returned 2692 at `-e 2` and while the 40 dB board returned
  #    2376 at `-e 4`. Unexplained and fork-side. Nothing here asks for `-e 4`
  #    at 20 dB, which is why the comprehensive `-e` entry is the 40 dB one.
  classic-weak-link:
    # Follow a known piconet over the weak link: `-l`/`-u` targeting and the
    # packet floor, with the clock acquired at this attenuation.
    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        weak link: {Ubertooth: 20}
        coverage: smoke
        duration: 25s

    # AFH recovery is the one check attenuation makes *better*, measured
    # against the peers' known 38-channel map over 70 s:
    #
    #   clear 3460    53 channels marked, 38/38 found, 15 false, 0 missed
    #   20 dB 1cc0    38 channels marked, 38/38 found,  0 false, 0 missed
    #   40 dB 13e0    36 channels marked, 36/38 found,  0 false, 2 missed
    #   clear 1d00    49 channels marked, 38/38 found, 11 false, 0 missed
    #
    # 20 dB recovered the map exactly. The test keeps its committed
    # tolerances; this entry is where they are met with the most room.
    - Recover AFH map:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        weak link: {Ubertooth: 20}
        coverage: smoke
        duration: 2m

    # UAP and clock recovery at the weakest link measured: the peers' real
    # UAP is known, so a wrong one is recognizable, and the clock was
    # acquired at this attenuation.
    - Capture known Classic device:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        weak link: {Ubertooth: 40}
        coverage: smoke
        duration: 25s

    # The access-code error threshold: comprehensive, because the `-e` cases
    # are comprehensive-only.
    - Classic Bluetooth receive:
        hosts: [Host_Linux]
        Ubertooth: default
        weak link: {Ubertooth: 40}
        coverage: comprehensive
        duration: 25s
