plan: Classic Bluetooth piconet capture
suites:
  # Needs a Linux host with an Ubertooth and two ESP32 Classic peers
  # registered with the acceptor and initiator roles and their BD_ADDRs
  # (hardware.example.yaml). The two peers hold a Serial Port Profile link
  # and stream over it; the Ubertooth only receives. The peers must already
  # run firmware/esp32-classic-peer utesp-1.0.0 or a later 1.x image: unlike
  # the DK cases, nothing here flashes them, and a board running something
  # older fails mandatory preflight with the version it reports. Other
  # registered Ubertooths on the host are guarded (read only).
  #
  # 25 s per capture is what the bench needs for a useful count: the
  # Ubertooth sweeps 79 channels and decodes about one packet of the piconet
  # a second.
  classic:
    - Capture known Classic device:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

  classic-comprehensive:
    - Capture known Classic device:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s

    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s

  # The bounded long variant: the same two smoke cases over a capture long
  # enough to show that a receive run holds up, rather than that it starts.
  # Two captures of five minutes each, so about eleven minutes with the
  # bring-ups; the boards are held throughout. It is not a soak with
  # sampling: `Classic Bluetooth receive soak` is still a backlog entry, and
  # the sampling is what it is waiting for.
  classic-long:
    - Follow Classic Bluetooth piconet:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 5m

  # The alternate firmware image, end to end. It writes the board's firmware,
  # so it is the only test in this suite: a test after it would run on an
  # image this one put there, which mandatory preflight refuses. One
  # flash-and-session cycle, about a minute, and the cleanup always writes
  # `bluetooth_rxtx` back.
  #
  # The run has to carry both firmware images and the Python tools, because
  # `ubertooth-btbr` is one of them: `run-suite --build --with-firmware
  # --with-python`. Passing the images by hand works too
  # (`--artifact "btbr build=PATH" --artifact "test build=PATH"`), but the
  # tool still needs `--with-python`, and without either the case is left out
  # as not applicable rather than failing.
  #
  # This suite is release coverage as well: it is the only test of
  # `ubertooth-btbr` and of the `btbr` image, and `testplans/release.yaml`
  # cannot hold it, because every test there runs anywhere and this one needs
  # a Linux target with a registered peer. Run it alongside the release plan.
  btbr:
    - Classic btbr console:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        allow RF transmission: true
        coverage: smoke

  # Comprehensive adds the page nothing answers, which costs the firmware's
  # whole 45 s page attempt.
  btbr-comprehensive:
    - Classic btbr console:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        allow RF transmission: true
        coverage: comprehensive

  # The repetition suite: five flash-and-session cycles, about five minutes,
  # so a flash that only works the first time or a page that only connects
  # once shows up. Ten firmware writes, so it holds the board throughout.
  btbr-long:
    - Classic btbr console:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        allow RF transmission: true
        coverage: smoke
        sessions: 5
