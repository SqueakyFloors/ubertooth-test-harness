plan: Ubertooth reliability
suites:
  slow:
    # Kills a capture outright, so it runs before the flashing tests: a board
    # it left in a mode is the state the next test has to cope with.
    - Board state between runs:
        hosts: each
        Ubertooth: default
        duration: 3s

    # Writes and reads back the selected board's firmware, so it comes after
    # every test that needs the resolved firmware (with Flash reliability).
    # Both fail at fork 6fee30c on fork #267 (-d -r exits 1 after a good
    # flash), fixed in 89d9197.
    - DFU images:
        hosts: each
        Ubertooth: default
        coverage: smoke

    - Flash reliability:
        hosts: each
        platforms: [macos, linux]
        Ubertooth: default
        flashes: 100
        image sequence: [test build, KGV]
        KGV sha256: e3fcb486c6e0ce7cc991bf6439f6dbc0156ed1229c2b95ebfd02198f9675bb11
        KGV revision: 2020-12-R1
