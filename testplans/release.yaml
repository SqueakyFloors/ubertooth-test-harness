plan: Ubertooth release preparation
suites:
  release:
    - Host CLI surface:
        hosts: each

    - Ubertooth count:
        hosts: each
        Ubertooth: default

    # No Ubertooth.
    - Refused command lines:
        hosts: each
        coverage: comprehensive

    # No Ubertooth: the board lookup with the no-devices switch, and
    # ubertooth-rx -i for the capture writers.
    - Failed capture files:
        hosts: each
        coverage: comprehensive

    # No Ubertooth. Follows fork main db5649b: -f is an unknown option and
    # -N prints the count, then runs the rest of the command.
    - Util mode refusals:
        hosts: each
        coverage: comprehensive

    # No Ubertooth. sign-read-only-directory skips when run as root.
    - DFU image checks:
        hosts: each
        coverage: comprehensive

    # No Ubertooth.
    - Python tools:
        hosts: each
        coverage: comprehensive

    - BLE extcap interfaces:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE extcap capture:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth identity:
        hosts: each
        Ubertooth: default

    - Ubertooth util compositions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Argument validation:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Radio setting transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE CRC transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE mode conflicts:
        hosts: each
        Ubertooth: default

    # Fork main refuses every pair (SqueakyFloors/ubertooth#82); passed on
    # hardware at fork 3b22c95. The RF guard stays: a regression that
    # accepted a pair would transmit.
    - Ubertooth util conflicts:
        hosts: each
        Ubertooth: default
        allow RF transmission: true

    - Raw receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # Their comprehensive cases also check fork fixes (#164, #171, #173,
    # #185, #187, #188, #189, #190, #191), so they fail on fork builds before
    # 3b22c95. A cleanly failed test no longer ends the run (#41).
    - Debug registers:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE settings:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Spectrum analyzer:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth util modes:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    # Skipped on a host with fewer than two registered Ubertooths.
    - Multi-board selection:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Classic Bluetooth receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # One board, no peer: a real SIGINT to a running capture, and one that
    # arrives before the capture can be going.
    - Interrupting a capture:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    # No Ubertooth.
    - Raw receive replay:
        hosts: each
        coverage: comprehensive

    # The only entry here that needs a peer: the two ESP32 Classic boards
    # hold a piconet to a chosen channel map, which is the only traffic on
    # the bench whose AFH map is known, so nothing else can check that
    # `ubertooth-afh` recovers one. It is therefore the Linux host's alone,
    # and a release run on a host without the pair skips it.
    #
    # The smoke profile: its two capture cases, the 40-channel map and the
    # 20-channel minimum, are what a regression in the map recovery shows up
    # in. The comprehensive third case, the -t detection phase, runs in
    # classic-comprehensive rather than lengthening the gate by another two
    # captures.
    - Recover AFH map:
        hosts: [Host_Linux]
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 90s
