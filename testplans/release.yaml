plan: Ubertooth release preparation
suites:
  release:
    - Host CLI surface:
        hosts: each

    - Ubertooth count:
        hosts: each
        Ubertooth: default

    - Ubertooth identity:
        hosts: each
        Ubertooth: default

    - Ubertooth util compositions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Argument validation:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Radio setting transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE CRC transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE mode conflicts:
        hosts: each
        Ubertooth: default

    # Add "Ubertooth util conflicts" once SqueakyFloors/ubertooth#82 is fixed;
    # until then it fails against main by design.

    - Raw receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # Their strict cases fail until fork #171, #173, #185, #188, #189, and #190
    # are fixed (and on builds before the #164 fix). A cleanly failed test no
    # longer ends the run (#41).
    - Debug registers:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE settings:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Spectrum analyzer:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth util modes:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    # Skipped on a host with fewer than two registered Ubertooths.
    - Multi-board selection:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Classic Bluetooth receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # No Ubertooth. Strict cases fail until fork #202 and #203 are fixed.
    - Raw receive replay:
        hosts: each
        coverage: comprehensive
