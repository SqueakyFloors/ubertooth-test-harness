plan: Ubertooth release preparation
suites:
  release:
    - Host CLI surface:
        hosts: each

    - Ubertooth count:
        hosts: each
        Ubertooth: default

    - Ubertooth identity:
        hosts: each
        Ubertooth: default

    - Ubertooth util compositions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Argument validation:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Radio setting transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE CRC transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE mode conflicts:
        hosts: each
        Ubertooth: default

    # Add "Ubertooth util conflicts" once SqueakyFloors/ubertooth#82 is fixed;
    # until then it fails against main by design.

    # Their strict cases fail until fork #171 and #173 are fixed (and on builds
    # before the #164 fix). A cleanly failed test no longer ends the run.
    - Debug registers:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE settings:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Spectrum analyzer:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s
