plan: Ubertooth release preparation
suites:
  release:
    - Host CLI surface:
        hosts: each

    - Ubertooth count:
        hosts: each
        Ubertooth: default

    # No Ubertooth.
    - Refused command lines:
        hosts: each
        coverage: comprehensive

    # No Ubertooth: the board lookup with the no-devices switch, and
    # ubertooth-rx -i for the capture writers.
    - Failed capture files:
        hosts: each
        coverage: comprehensive

    # No Ubertooth. Follows fork main db5649b: -f is an unknown option and
    # -N prints the count, then runs the rest of the command.
    - Util mode refusals:
        hosts: each
        coverage: comprehensive

    # No Ubertooth. sign-read-only-directory skips when run as root.
    - DFU image checks:
        hosts: each
        coverage: comprehensive

    # No Ubertooth.
    - Python tools:
        hosts: each
        coverage: comprehensive

    - BLE extcap interfaces:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE extcap capture:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth identity:
        hosts: each
        Ubertooth: default

    - Ubertooth util compositions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Argument validation:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Radio setting transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE CRC transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE mode conflicts:
        hosts: each
        Ubertooth: default

    # Fork main refuses every pair (SqueakyFloors/ubertooth#82); passed on
    # hardware at fork 3b22c95. The RF guard stays: a regression that
    # accepted a pair would transmit.
    - Ubertooth util conflicts:
        hosts: each
        Ubertooth: default
        allow RF transmission: true

    - Raw receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # Their comprehensive cases also check fork fixes (#164, #171, #173,
    # #185, #187, #188, #189, #190, #191), so they fail on fork builds before
    # 3b22c95. A cleanly failed test no longer ends the run (#41).
    - Debug registers:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE settings:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Spectrum analyzer:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth util modes:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    # Skipped on a host with fewer than two registered Ubertooths.
    - Multi-board selection:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Classic Bluetooth receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # One board, no peer: a real SIGINT to a running capture, and one that
    # arrives before the capture can be going.
    - Interrupting a capture:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    # No Ubertooth.
    - Raw receive replay:
        hosts: each
        coverage: comprehensive

    # The one entry that names a bench host, and the one that needs a peer:
    # the two ESP32 Classic peers hold a piconet to a chosen channel map, and
    # a release has to carry the measurement that `ubertooth-afh` still
    # recovers that map from the air.
    #
    # `required hardware: true` is what makes naming one host honest here. A
    # registry without `Host_Linux`, or with it but without the peers, still
    # compiles the plan and runs every other test (#265), and this step is
    # recorded as blocked rather than quietly left out (#269): the run then
    # finishes failed, so the gate cannot pass unmeasured. Register the peers,
    # or run a suite that does not hold it.
    #
    # Smoke, two captures of two minutes: about 520 s, taking the release
    # estimate from about 636 s to about 1156 s (19 min), inside the 30-minute
    # target. The comprehensive profile's third case (`-t`, the detection
    # path) stays in the `classic-comprehensive` suite, which a release runs
    # alongside this plan.
    - Recover AFH map:
        hosts: [Host_Linux]
        required hardware: true
        Ubertooth: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 2m

    # `Classic btbr console` is deliberately not here, although it is the only
    # coverage of `ubertooth-btbr` and of the `btbr` firmware image: it writes
    # the board's firmware, so it has to be the only test of its suite, since
    # a test after it would run on the image it left behind and mandatory
    # preflight refuses that. It also needs a run carrying both firmware
    # images and the Python tools. It lives in the `btbr` suite of
    # `testplans/classic.yaml` with the other peer tests, and a release runs
    # that suite as well (README, "Option compositions and stateful
    # transitions").
