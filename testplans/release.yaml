plan: Ubertooth release preparation
suites:
  release:
    - Host CLI surface:
        hosts: each

    - Ubertooth count:
        hosts: each
        Ubertooth: default

    # No Ubertooth.
    - Refused command lines:
        hosts: each
        coverage: comprehensive

    # No Ubertooth. Follows fork main db5649b: -f is an unknown option and
    # -N prints the count, then runs the rest of the command.
    - Util mode refusals:
        hosts: each
        coverage: comprehensive

    # No Ubertooth. sign-read-only-directory skips when run as root.
    - DFU image checks:
        hosts: each
        coverage: comprehensive

    # No Ubertooth.
    - Python tools:
        hosts: each
        coverage: comprehensive

    - BLE extcap interfaces:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE extcap capture:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth identity:
        hosts: each
        Ubertooth: default

    - Ubertooth util compositions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Argument validation:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Radio setting transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE CRC transitions:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE mode conflicts:
        hosts: each
        Ubertooth: default

    # Fork main refuses every pair (SqueakyFloors/ubertooth#82); passed on
    # hardware at fork 3b22c95. The RF guard stays: a regression that
    # accepted a pair would transmit.
    - Ubertooth util conflicts:
        hosts: each
        Ubertooth: default
        allow RF transmission: true

    - Raw receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # Their comprehensive cases also check fork fixes (#164, #171, #173,
    # #185, #187, #188, #189, #190, #191), so they fail on fork builds before
    # 3b22c95. A cleanly failed test no longer ends the run (#41).
    - Debug registers:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - BLE settings:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Spectrum analyzer:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    - Ubertooth util modes:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    # Skipped on a host with fewer than two registered Ubertooths.
    - Multi-board selection:
        hosts: each
        Ubertooth: default
        coverage: comprehensive

    - Classic Bluetooth receive:
        hosts: each
        Ubertooth: default
        coverage: comprehensive
        duration: 3s

    # No Ubertooth.
    - Raw receive replay:
        hosts: each
        coverage: comprehensive
