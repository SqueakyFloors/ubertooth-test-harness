plan: Ubertooth host only
# Tests that need no Ubertooth: they run on a host with none registered or
# attached, such as the CI build job (scripts/ci.sh build).
suites:
  host:
    - Host CLI surface:
        hosts: each

    - Raw receive replay:
        hosts: each
        coverage: smoke

    # Every tool runs with UBERTOOTH_TEST_NO_DEVICES=1; skipped when the built
    # libubertooth predates it (fork b6d8ede). ubertooth-follow and
    # ubertooth-scan cases are not applicable where they are not built (no BlueZ).
    - Refused command lines:
        hosts: each
        coverage: smoke

    # A failed capture's files, with UBERTOOTH_TEST_NO_DEVICES=1 for the
    # board lookup and ubertooth-rx -i for the writers; skipped when the
    # built libubertooth predates the switch (fork b6d8ede).
    - Failed capture files:
        hosts: each
        coverage: smoke

    # ubertooth-util -f/-i combinations with UBERTOOTH_TEST_NO_DEVICES=1;
    # skipped when the built libubertooth predates it (fork b6d8ede).
    - Util mode refusals:
        hosts: each
        coverage: smoke

    # ubertooth-dfu with UBERTOOTH_TEST_NO_DEVICES=1 on a synthetic image;
    # sign-test-build skips without a firmware build (none here, or in CI).
    - DFU image checks:
        hosts: each
        coverage: smoke

    # specan-ui is skipped without --build --with-python and numpy/qtpy.
    - Python tools:
        hosts: each
        coverage: smoke
