plan: Ubertooth fast
suites:
  fast:
    - Host CLI surface:
        hosts: each

    # No Ubertooth: ubertooth-rx -i on a synthetic fixture.
    - Raw receive replay:
        hosts: each
        coverage: smoke

    # No Ubertooth: refused command lines leave output files alone.
    - Refused command lines:
        hosts: each
        coverage: smoke

    # No Ubertooth: ubertooth-dfu image checks and -s.
    - DFU image checks:
        hosts: each
        coverage: smoke

    # No Ubertooth. specan-ui needs --build --with-python and numpy/qtpy,
    # else it is skipped.
    - Python tools:
        hosts: each
        coverage: smoke

    - Ubertooth count:
        hosts: each
        Ubertooth: default

    - BLE extcap interfaces:
        hosts: each
        Ubertooth: default
        coverage: smoke

    - BLE extcap capture:
        hosts: each
        Ubertooth: default
