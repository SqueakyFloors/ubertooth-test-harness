    - Ubertooth identity:
        hosts: each
        Ubertooth: default

    - Debug register read:
        hosts: each
        Ubertooth: default
        register: 0x00

    - Ubertooth util compositions:
        hosts: each
        Ubertooth: default
        coverage: smoke

    - Argument validation:
        hosts: each
        Ubertooth: default
        coverage: smoke

    - Debug registers:
        hosts: each
        Ubertooth: default
        coverage: smoke

    - BLE settings:
        hosts: each
