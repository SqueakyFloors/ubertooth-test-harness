plan: BlueZ tools with a host Bluetooth adapter
# The two tools the fork builds only with libbluetooth, ubertooth-scan and
# ubertooth-follow, drive a Bluetooth controller of the host's as well as an
# Ubertooth. This plan is where they live.
#
# Needs a Linux host with an Ubertooth, a `Bluetooth adapter` resource (the
# controller's hci device name and the address it reports), and the two ESP32
# Classic peers registered with the acceptor and initiator roles
# (hardware.example.yaml). The pair holds a Serial Port Profile link and
# streams over it, so the adapter has a discoverable device to find and the
# Ubertooth a piconet to sweep for; the Ubertooth only receives. The peers
# must already run firmware/esp32-classic-peer utesp-1.0.0 or a later 1.x
# image: nothing here flashes them.
#
# Every case here has run on a bench with a USB adapter, and both suites
# have passed: smoke in 300 to 407 s over seven runs and comprehensive in
# 390, 400 and 526 s, at the durations below. Two different adapters were
# used, with a registry per adapter differing in one line, and every command
# in a run named the adapter that run was given. What the runs settled and
# what they left open is in docs/tests.md under each test.
#
# This plan is still NOT in release.yaml, and the reason is now the peers
# rather than the adapter. Two peer-side faults were measured while running
# it: bytes lost on a bridge's serial line under load, which failed 7 of 91
# pair sessions (issue #310), and peers that would not come back to their
# boot state, 3 more of those 91 and one peer back at boot mid-capture in 47
# follow runs (issue #311). Eleven of 91 sessions means a four-case suite
# fails about two runs in five, so the plan runs on its own until those are
# fixed. Its smoke
# estimate is 345 s, which would take the release suite from about 1174 s to
# about 1519 s (roughly 25 minutes) on the one host that has an adapter.
#
# 25 s per capture is what the bench needs for a useful count of this
# piconet, as the classic plan records: the Ubertooth sweeps 79 channels and
# decodes about one packet of the piconet a second.
#
# A `duration:` here is a floor on the capture, and neither tool's command is
# that long. `ubertooth-scan` arms the alarm `-t` asks for only after its
# BlueZ inquiry has run, so `-s` adds a whole inquiry (about 10 s) on top, and
# both halves page each device they found for its name. `ubertooth-follow` has
# no capture timeout at all: the driver ends it, and the page (up to 25 s),
# the clock reads, the teardown of the link it made, and the board setup all
# happen inside the window it is given, so that window is the capture plus an
# allowance for all of it -- about 77 s for a 25 s duration, and the bench
# measured the command at 83 s. The cases carry those allowances; a run of
# this plan takes several times the sum of its durations. The estimates in
# catalog.py have the measured figures.
suites:
  hci:
    - Bluetooth inquiry scan:
        hosts: [Host_Linux]
        Ubertooth: default
        Bluetooth adapter: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

    - Follow Classic piconet over HCI:
        hosts: [Host_Linux]
        Ubertooth: default
        Bluetooth adapter: default
        acceptor: default
        initiator: default
        coverage: smoke
        duration: 25s

  hci-comprehensive:
    - Bluetooth inquiry scan:
        hosts: [Host_Linux]
        Ubertooth: default
        Bluetooth adapter: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s

    - Follow Classic piconet over HCI:
        hosts: [Host_Linux]
        Ubertooth: default
        Bluetooth adapter: default
        acceptor: default
        initiator: default
        coverage: comprehensive
        duration: 25s
