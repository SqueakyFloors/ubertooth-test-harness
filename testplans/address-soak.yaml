plan: BLE address parity and soak
# One Ubertooth, pinned by serial, and one nRF52840 DK registered with the
# advertiser role and its BLE address (hardware.example.yaml). The DK
# transmits at normal BLE power on the one channel each suite names; the
# Ubertooth only receives. Pass the DK image to flash when the board runs
# another firmware version: --artifact "nRF52840 advertiser=PATH/utdk.hex"
# (firmware/nrf52840dk/README.md). Other registered Ubertooths on the host
# are guarded (read only).
#
# None of these suites is in `fast` or in the non-soak `release` plan: the
# shortest of them is minutes and the longest is three days. The long ones
# run on the persistent target runner, which keeps running when whatever
# started the run disconnects; the run directory holds the record
# (README, "Target runner service").
#
#   python -m ubertooth_harness run-suite \
#     --plan testplans/address-soak.yaml --suite address-parity \
#     --hardware hardware.yaml --host Host_Linux \
#     --ubertooth-source /path/to/ubertooth --ubertooth-ref main \
#     --artifact "nRF52840 advertiser=/path/to/zephyr.hex" --output runs
#
# The four suites differ only in how long they run and in the figures that
# follow from that; what each one checks is the same.
suites:
  # The short functional run: everything the long suites do, in about a
  # minute of capture, so a change to the driver or the catalog can be tried
  # on the bench without booking the boards for hours. It is also the suite
  # the restart probe belongs in: killing the capture once, with no stop sent
  # to the board, is how the run shows the restart path recovers, and the
  # cheapest place to show it is here.
  address-parity:
    - BLE address parity soak:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        duration: 1m
        channel: 37
        interval: 100
        payload: c0ffee
        advertiser on: 10s
        advertiser off: 10s
        sample every: 10s
        presence window: 1s
        presence windows: 5
        liveness timeout: 25s
        detect within: 5s
        minimum detection share: 0.9
        maximum gap: 20s
        minimum packets per minute: 10
        maximum window disagreement share: 0.05
        maximum restarts: 0
        restart probe: true
        capture file limit: 64

  # Four hours: the setup validation run. Long enough to find a capture that
  # dies, a reader that drifts, or a board that resets itself, and short
  # enough to run between other bench work. The schedule is #703's example
  # (30 s on, 30 s off), which every longer suite keeps.
  address-soak-4h:
    - BLE address parity soak:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        duration: 4h
        channel: 37
        interval: 100
        payload: c0ffee
        advertiser on: 30s
        advertiser off: 30s
        sample every: 1m
        presence window: 2s
        presence windows: 5
        liveness timeout: 1m
        detect within: 10s
        minimum detection share: 0.95
        maximum gap: 90s
        minimum packets per minute: 10
        maximum window disagreement share: 0.02
        maximum restarts: 0
        restart probe: false
        capture file limit: 256

  # A day. The same figures as the four-hour run, sampled less often because
  # a progress record a minute over a day is 1440 of them and that is
  # already more than a reader wants.
  address-soak-24h:
    - BLE address parity soak:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        duration: 24h
        channel: 37
        interval: 100
        payload: c0ffee
        advertiser on: 30s
        advertiser off: 30s
        sample every: 5m
        presence window: 2s
        presence windows: 5
        liveness timeout: 1m
        detect within: 10s
        minimum detection share: 0.95
        maximum gap: 90s
        minimum packets per minute: 10
        maximum window disagreement share: 0.02
        maximum restarts: 0
        restart probe: false
        capture file limit: 256

  # Three days: the release-candidate soak #703 asks for before a release.
  # It holds one Ubertooth and one DK for the whole window, so it is booked
  # rather than scheduled, and nothing else on those boards runs meanwhile.
  address-soak-72h:
    - BLE address parity soak:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        duration: 72h
        channel: 37
        interval: 100
        payload: c0ffee
        advertiser on: 30s
        advertiser off: 30s
        sample every: 15m
        presence window: 2s
        presence windows: 5
        liveness timeout: 1m
        detect within: 10s
        minimum detection share: 0.95
        maximum gap: 90s
        minimum packets per minute: 10
        maximum window disagreement share: 0.02
        maximum restarts: 0
        restart probe: false
        capture file limit: 512
