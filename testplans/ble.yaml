plan: BLE advertiser capture
suites:
  # Needs a Linux host with an Ubertooth and an nRF52840 DK registered with
  # the advertiser role and its BLE address (hardware.example.yaml). The DK
  # transmits at normal BLE power on the channel each case sets; the
  # Ubertooth only receives. Pass the DK image to flash when the board runs
  # another firmware version: --artifact "nRF52840 advertiser=PATH/utdk.hex"
  # (firmware/nrf52840dk/README.md). Other registered Ubertooths on the host
  # are guarded (read only).
  ble:
    - Capture known BLE advertiser:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        coverage: smoke
        duration: 5s
        interval: 100
        payload: c0ffee

    # The same advertiser, read by real tshark through the extcap plugin.
    # Needs tshark on the host (no GUI); without it the test is not
    # applicable, and --dry-run says so.
    - BLE extcap in tshark:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        coverage: smoke
        duration: 15s

  # Two more DKs, registered with the central and peripheral roles, connect
  # on the 1M PHY with Data Length Extension while the Ubertooth follows
  # them with `ubertooth-btle -f`.
  connection:
    - Capture known BLE connection:
        hosts: [Host_Linux]
        Ubertooth: default
        central: default
        peripheral: default
        coverage: smoke
        # The capture must span one of the central's reconnections and not
        # two: 5 s < duration < 10 s (connection_cases.CYCLE_MS).
        duration: 8s
        interval: 30
        update: 60

    # The window the case above leaves out: one capture across several of
    # the central's reconnections.
    - Follow a BLE connection across its end:
        hosts: [Host_Linux]
        Ubertooth: default
        central: default
        peripheral: default
        # Longer than three of the central's 5 s connections
        # (connection_cases.MIN_CYCLES).
        duration: 18s
        interval: 30
        update: 60

  ble-comprehensive:
    - Capture known BLE advertiser:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        coverage: comprehensive
        duration: 5s
        interval: 100
        payload: c0ffee

    - BLE extcap in tshark:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        coverage: comprehensive
        duration: 15s

    - Capture known BLE connection:
        hosts: [Host_Linux]
        Ubertooth: default
        central: default
        peripheral: default
        coverage: comprehensive
        duration: 8s
        interval: 30
        update: 60

    # One capture case either way, so the same entry as the smoke suite.
    - Follow a BLE connection across its end:
        hosts: [Host_Linux]
        Ubertooth: default
        central: default
        peripheral: default
        duration: 18s
        interval: 30
        update: 60

  # The same advertiser read by the weak-link receivers, which is what #168
  # asked for: does a DK capture still work with the Ubertooth behind an
  # attenuator? Measured 2026-11-02 in the attenuated device sweep, 25 s per
  # leg against a DK advertising every 20 ms (about 1250 expected):
  #
  #   clear  1193 advertisements, 1193 valid CRC, 0 invalid, RSSI mean -29.9
  #   20 dB  1175 advertisements, 1175 valid CRC, 0 invalid, RSSI mean -69.0
  #   40 dB  1228 advertisements, 1228 valid CRC, 0 invalid, RSSI mean -70.0
  #
  # So attenuation costs this capture nothing, and the test's own floor (a
  # fifth of the expected advertisements, advertiser_cases.MIN_SHARE) holds
  # with large margin at both. No threshold is changed or added here: both
  # entries are the committed test, pointed at a different board.
  #
  # Worth knowing when reading a run: the raw record count falls with
  # attenuation (12144, 8161, 6098) while the advertisement count stays flat.
  # The clear board's extra records are ambient traffic and false
  # access-address matches, not signal, so a raw count is a bad quality
  # measure here.
  ble-weak-link:
    - Capture known BLE advertiser:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        weak link: {Ubertooth: 20}
        coverage: smoke
        duration: 5s
        interval: 100
        payload: c0ffee

    - Capture known BLE advertiser:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        weak link: {Ubertooth: 40}
        coverage: smoke
        duration: 5s
        interval: 100
        payload: c0ffee
