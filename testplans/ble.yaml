plan: BLE advertiser capture
suites:
  # Needs a Linux host with an Ubertooth and an nRF52840 DK registered with
  # the advertiser role and its BLE address (hardware.example.yaml). The DK
  # transmits at normal BLE power on the channel each case sets; the
  # Ubertooth only receives. Pass the DK image to flash when the board runs
  # another firmware version: --artifact "nRF52840 advertiser=PATH/utdk.hex"
  # (firmware/nrf52840dk/README.md). Other registered Ubertooths on the host
  # are guarded (read only).
  ble:
    - Capture known BLE advertiser:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        coverage: smoke
        duration: 5s
        interval: 100
        payload: c0ffee

  ble-comprehensive:
    - Capture known BLE advertiser:
        hosts: [Host_Linux]
        Ubertooth: default
        advertiser: default
        coverage: comprehensive
        duration: 5s
        interval: 100
        payload: c0ffee
