plan: Two-device range test
suites:
  range:
    # Needs two registered Ubertooths on one Linux host: the default board
    # sends (-n) and UT_Linux1 repeats (-e). The test transmits: both boards
    # send, the sender at every PA level up to 0 dBm. Run it only where that
    # is allowed, for example in a shielded box or on an RF-isolated bench.
    # Other registered boards on the host are guarded (read only).
    - Two-device range test:
        host: Host_Linux
        sender: default
        responder: UT_Linux1
        allow RF transmission: true
        # The lab boards sit a few centimetres apart; a working link gets
        # through at the lowest levels.
        maximum PA level: 3

  # The same test with the weak-link receiver answering: both roles are
  # chosen by RF placement rather than by alias, which also keeps them apart
  # on a bench whose default board is the attenuated one. The suite names one
  # host, so a bench with no board placed for the responder fails planning,
  # naming the requirement and what each board is placed as.
  #
  # No `maximum PA level`, so it keeps the default of 7 and asserts nothing
  # about the level. The requirement accepts 10 to 20 dB at any distance (an
  # rf requirement has no distance key), and the bench measured one point of
  # that: 20 dB at a meter. A bound taken from one point would be a guess
  # everywhere else, and this suite has never reached the step that judges it.
  # What it does assert is the rest of the case -- the round trip, the
  # repeater answering before and after, the idle reset, and restoration --
  # with an attenuated board answering. docs/tests.md has the numbers.
  range-weak-link:
    - Two-device range test:
        host: Host_Linux
        sender: default
        responder: default
        rf:
          sender: {max_attenuation_db: 0, antenna: true}
          responder: {min_attenuation_db: 10, max_attenuation_db: 20, antenna: true}
        allow RF transmission: true
