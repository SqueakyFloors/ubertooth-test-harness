plan: Two-device range test
suites:
  range:
    # Needs two registered Ubertooths on one Linux host: the default board
    # sends (-n) and UT_Linux1 repeats (-e). The test transmits: both boards
    # send, the sender at every PA level up to 0 dBm. Run it only where that
    # is allowed, for example in a shielded box or on an RF-isolated bench.
    # Other registered boards on the host are guarded (read only).
    - Two-device range test:
        host: Host_Linux
        sender: default
        responder: UT_Linux1
        allow RF transmission: true
        # The lab boards sit a few centimetres apart; a working link gets
        # through at the lowest levels.
        maximum PA level: 3

  # The same test with the weak-link receiver answering: both roles are
  # chosen by RF placement rather than by alias, the responder behind an
  # attenuator and the sender in the open. Naming both keeps them apart on a
  # bench whose default board is the attenuated one, where two `default`
  # selectors would resolve to it and planning would fail.
  #
  # This suite needs such a board: it names one host, so a bench with none
  # fails planning, naming the requirement and what each board is placed as.
  # Delete the suite, or the whole plan, on a bench without one.
  #
  # The level is measured in this orientation: with the responder a meter
  # away behind 20 dB and the sender in the open, five round trips reported
  # ten PA levels (a request and a reply each) and every one was 0 or 1, so 2
  # is the observed maximum plus one level of headroom. That is tighter than
  # the 3 the main suite allows. The reverse orientation, which this suite
  # never plans, reported one level 2.
  #
  # The placement is bounded above because 20 dB is the only value measured,
  # and the antenna is pinned because a board with none would be weaker
  # still: more loss needs a higher level, which would make this ceiling
  # wrong rather than strict. Distance cannot be pinned (an rf requirement
  # has no distance key), so a board at this attenuation but much further
  # away may need a higher level than the meter this was measured at.
  range-weak-link:
    - Two-device range test:
        host: Host_Linux
        sender: default
        responder: default
        rf:
          sender: {max_attenuation_db: 0, antenna: true}
          responder: {min_attenuation_db: 10, max_attenuation_db: 20, antenna: true}
        allow RF transmission: true
        maximum PA level: 2
