plan: Ubertooth backlog
# Planned tests with no implementation yet; run-suite refuses them. A
# runnable plan may name only implemented tests (validate-plan checks it).
runnable: false
suites:
  backlog:
    - Capture eero setup beacon:
        eero: required
        Ubertooth: default

    # Still waiting on hardware (#88): the ESP32 peers give us a piconet, so
    # `ubertooth-afh -l -u` has something to recover a map from, but no case
    # is written yet. `Follow Classic Bluetooth piconet` has moved to the
    # classic plan now that the peers are on the bench.
    - Recover AFH map:
        piconet: required
        Ubertooth: default

    - Bluetooth inquiry scan:
        Bluetooth adapter: required
        Ubertooth: default

    # The lab hub can switch board power now (#2); the test is #141.
    - Reset into invalid application:
        Ubertooth: default
        USB power controller: required

    - Receive-only firmware:
        Ubertooth: default

    - Uberducky HID:
        Uberducky: required

    - E-GO skateboard capture:
        skateboard: required

    # Not implemented yet; the known advertiser (#86) is in the ble plan.
    - BLE monitor:
        hosts: each
        Ubertooth: default
        duration: 10s

    # Long-run sampling is not implemented yet.
    - BLE soak:
        hosts: each
        Ubertooth: default
        duration: 30m
        sample every: 5s

    - Spectrum soak:
        hosts: each
        Ubertooth: default
        duration: 15m
        sample every: 5s

    # Sampling over a long run is what is missing here, not the traffic: the
    # classic plan's `classic-long` suite is the bounded long variant that
    # the ESP32 peers made possible.
    - Classic Bluetooth receive soak:
        hosts: each
        Ubertooth: default
        duration: 15m
        sample every: 5s
