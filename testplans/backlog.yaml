plan: Ubertooth backlog
# Planned tests with no implementation yet; run-suite refuses them. A
# runnable plan may name only implemented tests (validate-plan checks it).
runnable: false
suites:
  backlog:
    - Two-device range test:
        host: Host_Linux
        sender: default
        responder: explicit required

    - Capture known BLE advertiser:
        advertiser: required
        Ubertooth: default

    - Capture eero setup beacon:
        eero: required
        Ubertooth: default

    - Recover AFH map:
        piconet: required
        Ubertooth: default

    - Follow Classic Bluetooth piconet:
        piconet: required
        Ubertooth: default

    - Bluetooth inquiry scan:
        Bluetooth adapter: required
        Ubertooth: default

    - Reset into invalid application:
        Ubertooth: default
        USB power controller: required

    - Receive-only firmware:
        Ubertooth: default

    - Uberducky HID:
        Uberducky: required

    - E-GO skateboard capture:
        skateboard: required

    # No known BLE advertiser to monitor yet (hardware needed: #86).
    - BLE monitor:
        hosts: each
        Ubertooth: default
        duration: 10s

    # Long-run sampling is not implemented yet.
    - BLE soak:
        hosts: each
        Ubertooth: default
        duration: 30m
        sample every: 5s

    - Spectrum soak:
        hosts: each
        Ubertooth: default
        duration: 15m
        sample every: 5s

    - Classic Bluetooth receive soak:
        hosts: each
        Ubertooth: default
        duration: 15m
        sample every: 5s
