plan: Ubertooth backlog
# Planned tests with no implementation yet; run-suite refuses them. A
# runnable plan may name only implemented tests (validate-plan checks it).
runnable: false
suites:
  backlog:
    - Capture eero setup beacon:
        eero: required
        Ubertooth: default

    # The bench has an algorithm 1 connection now: one DK runs the
    # `-chansel1` image, whose controller has no algorithm 2, so every link it
    # makes hops with algorithm 1 and its `status` says so. What is not
    # settled is the outcome: on the bench `-p` recovered the access address
    # and the CRC init of such a connection and went no further in 90 s, so
    # the case waits for the hop interval and increment to be reached. See
    # docs/tests.md.
    - Recover a BLE connection promiscuously:
        hosts: [Host_Linux]
        Ubertooth: default
        central: default
        peripheral: default
        coverage: smoke
        duration: 90s

    - Bluetooth inquiry scan:
        Bluetooth adapter: required
        Ubertooth: default

    # `Reset into invalid application` is implemented (#141) and lives in
    # testplans/power.yaml, which is run by hand: it leaves a board outside
    # its application until its own recovery step, so someone has to be able
    # to reach the bench.

    - Receive-only firmware:
        Ubertooth: default

    - Uberducky HID:
        Uberducky: required

    - E-GO skateboard capture:
        skateboard: required

    # Not implemented yet; the known advertiser (#86) is in the ble plan.
    - BLE monitor:
        hosts: each
        Ubertooth: default
        duration: 10s

    # Long-run sampling is not implemented yet.
    - BLE soak:
        hosts: each
        Ubertooth: default
        duration: 30m
        sample every: 5s

    - Spectrum soak:
        hosts: each
        Ubertooth: default
        duration: 15m
        sample every: 5s

    # Sampling over a long run is what is missing here, not the traffic: the
    # classic plan's `classic-long` suite is the bounded long variant that
    # the ESP32 peers made possible.
    - Classic Bluetooth receive soak:
        hosts: each
        Ubertooth: default
        duration: 15m
        sample every: 5s
