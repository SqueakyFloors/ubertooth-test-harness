Flash reliability:
  purpose: >-
    Writes firmware to a board many times in a row and verifies every write,
    so a flash path that fails one time in fifty is caught rather than met
    during a release.
  theory: >-
    Alternating two images is what makes each write verifiable. Both are
    pinned by SHA-256 -- the test build against the run
    manifest and the known-good image against the plan's own hash -- checked
    before the run and again before each write, so a corrupted or swapped file
    cannot be mistaken for a flash failure; ubertooth-dfu -d ... -r reads its
    own write back against the file it wrote; and ubertooth-util -v afterwards
    must report the revision the image just written carries. The two images
    have to be different files, which is all the sequence requires: since
    ubertooth#1230 a version names the release a build came from rather than
    the build, so two images can be one release and two files, and the SHA-256
    is what tells them apart. The revision read after a write therefore says
    the right release is on the board, not which build of it. Every other
    registered board is
    read before the run and after every flash, so a write that reached the
    wrong board is caught rather than inferred.
  hardware: >-
    One Ubertooth, selected by full serial, plus every other registered board.
    It writes firmware repeatedly, so it must be the last test on that board
    in the suite and preflight checks only the board's serial. Nothing
    transmits. "alternate Ubertooths: true" rotates the writes across every
    registered board in alias order, and a named host with only one registered
    Ubertooth cannot alternate anything, so the step is blocked there and the
    run fails. The known-good image comes from an artifact only the command
    line passes, so this test runs from the command line.
  expected: >-
    One case, run by the flash runner rather than as a command line, however
    many flashes it runs. It passes when every requested write completed and
    verified. It fails and stops at the first mismatch: a write that did not
    take, a revision that does not match the image just written, a guard board
    whose revision changed or that disappeared, a per-flash write over 25 s,
    or the whole-test deadline. The watchdog reads happen between its writes,
    so a long soak reports a board that reset itself while it is still
    running.
  limitations: >-
    It measures the write-and-verify path, not what the firmware then does.
    Selectors must be full serials, because libubertooth reads an all-digit -U
    value as a USB index and otherwise matches the start of a serial, so the
    test refuses digit-only selectors and any selector that is the beginning
    of another. A manual recovery or a power cycle never turns a failed run
    into a pass.
  related: []

DFU images:
  purpose: >-
    Covers ubertooth-dfu beyond the write path on a real board: -s suffixing,
    -u read-back of what was written, and refusal of bad images before any
    write.
  theory: >-
    The first case writes the test image and reads it back, so from then on
    the flash contents are known and every later case can assert them. That is
    what makes a refusal case meaningful on hardware: after a bad image is
    refused, the read-back must still find the test image, which proves the
    refusal happened before the write rather than after a partial one. A
    read-back is compared with the image as the writer leaves it, not with the
    file: the two fields the writer fills in for the bootloader's checks are
    checked against what it should have worked out, so a board that kept the
    file's empty values fails, and every other byte has to match. The length
    is taken from the range the command printed rather than assumed, and it
    has to be one the harness's copy of the fork's part table explains and one
    the part the command named would have.
  hardware: >-
    One Ubertooth, selected by full serial, with every other registered board
    as guards. It writes firmware and establishes it, so preflight checks only
    the board's serial and the test must be the last one on that board. Needs
    the firmware build as the test image; a run without one is refused rather
    than leaving cases out. Nothing transmits.
  expected: >-
    Smoke runs 2 cases: -u reads back the image the write put there, and -s
    suffixes a binary identically to the build's .dfu. Comprehensive runs 12,
    adding the bad-image refusals with a read-back after each. Every case ends
    with the test image in flash, read back and verified, and the board in its
    application firmware; after each case the cleanup reads the flash back,
    rewrites the test image only if it differs, and checks the revision, so a
    failed case leaves the board usable and the run goes on.
  limitations: >-
    A board left in the DFU bootloader has no serial, so the cleanup can
    return it only when exactly one DFU device is attached and every other
    registered board answers in its application; otherwise the run stops for
    recovery by hand. A read-back can itself fail and leave the board in DFU,
    seen about once in twenty. Do not run this case against a build older than
    the fix that made -u read the part's own flash range: on a 128 KiB part
    such a read asks for flash above the end of it and faults the bootloader
    until the board is power-cycled.
  related:
    - ubertooth#233
    - ubertooth#208
    - ubertooth#1037
    - ubertooth#1048
    - ubertooth#242

Exclusive Ubertooth topology:
  purpose: >-
    Checks the commands that only work when one board is alone on the bus, by
    powering every other board off first. With more than one board enumerated
    and no -U, libubertooth refuses to choose and opens nothing, so these
    commands succeeding is a check on the topology rather than on the tools.
  theory: >-
    The no-selector serial read must report the selected board's serial, the
    firmware query must answer, and ubertooth-btle -f with no -U must keep
    running until its deadline. The capture case is the strictest of the
    three, because an early exit for any reason, including a second board
    appearing, gives a different exit status than the expected timeout.
  hardware: >-
    One Ubertooth plus power control over every other registered board on the
    host, which are switched off for the whole capture and restored
    afterwards. Linux and power control only. The capture window is bounded,
    because every other board stays powered off for the whole of it. Nothing
    transmits.
  expected: >-
    Three cases: the no-selector serial is the selected board's, the
    no-selector firmware query reaches one board, and the no-selector follow
    keeps running and is stopped at its deadline. The surrounding run powers
    the other boards down, verifies exactly one expected no-selector serial,
    and restores and reads back every original power state on success, failure
    or cancellation.
  limitations: >-
    It needs a switchable hub. Extra Ubertooths fail closed rather than being
    ignored: one the registry has on no power controller blocks the step, and
    one that turns up unregistered during the run fails the isolation check.
    The follow case proves the mode kept running, not that it captured
    anything.
  related: []

MAC polling soak:
  purpose: >-
    A catalog entry for a long-running MAC bucket and query workflow against a
    known advertiser. No implementation yet.
  theory: >-
    The intent is to reproduce the shape of a production-style MAC polling
    workload in the harness's own process: a persistent
    ubertooth-btle -n -U <serial> capture, in-memory MAC buckets rotated on
    a timer, lookups on a second timer, listener-silence detection, and the
    empty-bucket restart timing. Modeling it in-process is deliberate: the
    harness will not start the original workload and will not add a network
    listener. Every timing parameter is a plan argument, so the workload's
    shape is declared rather than hidden. What counts as a pass is not
    established beyond the bounds the arguments name.
  hardware: >-
    One Ubertooth and one nRF52840 DK advertiser, with exclusive use of the
    board, so every other registered board on the host is powered off. Linux
    and power control only. Every timing and bound of the workload is a plan
    argument.
  expected: >-
    No implementation; only a plan declaring runnable: false may name it. Its
    resource and power manifest already compiles, including every required
    power-off action.
  limitations: >-
    What counts as a pass is not established beyond the bounds the arguments
    name. On a host where another registered board is on no power controller
    the step is blocked, and since its plan holds this one step that leaves
    the suite nothing to run.
  related: []

