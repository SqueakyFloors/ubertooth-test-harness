Recover a BLE connection promiscuously:
  purpose: >-
    A catalog entry for ubertooth-btle -p against a live connection that hops
    with Bluetooth channel selection algorithm 1. No implementation yet, and
    the outcome has not been seen.
  theory: >-
    -p joins a connection that is already up, with no CONNECT_IND to read, so
    it has to work the connection out from the air: the access address, then
    the CRC init value, then the connection interval from the spacings between
    the connection's visits to the one channel it listens on, and last the hop
    increment. Only algorithm 1 repeats those visits on a cycle it can
    measure, which is why the fork documents -p as recovering algorithm 1
    connections only. The bench can now make one: a DK image built without
    algorithm 2 makes every connection it is part of an algorithm 1 one, and
    its status carries the proof.
  hardware: >-
    One Ubertooth, a central, and a peripheral (nRF52840 DK). The central
    would run the algorithm 1 image, since it is the side whose CONNECT_IND
    carries the ChSel bit, and the peripheral the default one. The pair would
    run without the reconnection cycle, because -p needs a connection that
    stays up, and the board's squelch has to be raised from its default -120
    dBm first: the access-address hunt is gated by it, and at the default it
    latches onto noise.
  expected: >-
    No implementation; only a plan declaring runnable: false may name it. The
    outcome it is meant to check is all four of the lines -p reports -- access
    address, CRC init, hop interval, and hop increment -- with the hop
    interval equal to the interval the central asked for.
  limitations: >-
    The hardware is on the bench and the connection is confirmed to be an
    algorithm 1 one; what is not yet shown is the outcome. In a 90-second run
    against such a connection, with the squelch at -60 dBm, -p reported the
    access address and the CRC init value and went no further, while over a
    hundred packets on that access address decoded with valid CRCs. Whether a
    longer run, another squelch or a change in the fork reaches the interval
    and the increment is open, so the case is not written to a result nobody
    has seen.
  related:
    - ubertooth-test-harness#88

Reset into invalid application:
  purpose: >-
    Checks that the bootloader refuses to start an application image it
    cannot start, and keeps running so the next image can go on over USB.
    Before that check existed, such a board faulted on every power-up and
    came back only when someone bridged its P4 entry pin at the bench, so
    what this proves is that an interrupted download is recoverable without
    opening the case.
  theory: >-
    The image is a valid Ubertooth DFU file whose two vector words are
    erased, which is what an interrupted download leaves in flash: the
    initial stack pointer must be inside RAM and word-aligned and the reset
    vector must be a Thumb address above the bootloader, and erased flash
    fails both. That is the first thing the bootloader asks, before either
    checksum, and the checksums could not be failed from a file anyway
    because ubertooth-dfu fills them in as it writes. The cycle cuts the
    board's USB power rather than resetting it, because the decision under
    test is the one taken on a cold boot, and the board has no serial while
    it sits in its bootloader, so it is identified by elimination: exactly
    one serial-less Ubertooth device attached, every other board still
    enumerated by its own serial.
  hardware: >-
    One Ubertooth whose bootloader came from this tree, with the startable
    check in it, on a hub that can switch VBUS for its own port, plus every
    other registered board on the host as a guard. Linux only, because the
    hub is reached through a serial-device path that only Linux has. The
    committed plan names the board
    the registry pairs with a debug programmer, so a board that does fault
    has a recovery path at hand without re-cabling. On a board carrying the
    factory bootloader this test does not fail, it bricks the board.
  expected: >-
    One case. The write reaches the flash and reports no verified revision,
    since the board stays in its bootloader; then, after the port comes back,
    the board's serial is absent, exactly one DFU bootloader device is
    attached, and every guard is where it was. A board that comes back
    running the image, or that does not come back, fails the case and the
    message says which. The recovery step writes the run's own image back and
    waits for the application to answer with the expected revision; it names
    the board where the board can answer and writes without a selector where
    it cannot, which is the expected path, since a board in its bootloader has
    no serial. The cleanup does the same whatever happened, so a failed case
    still ends with a board on the test image.
  limitations: >-
    A pass says what the bootloader in that board's flash does, and that
    bootloader is not what the run built: it cannot be written over USB, so a
    pass cannot be attributed to the commit the run was given. It is
    destructive -- if the bootloader does start the image, the board faults,
    leaves USB and needs its entry pin bridged by hand -- so it lives in a
    plan of its own, is run with someone at the bench, and no dispatched run
    or GUI click can start it. A run killed outright leaves the port off or
    the board in DFU, both put right by hand. The one hardware case covers
    erased vectors; the other unstartable images the harness can build are
    checked on the host only, because each extra case is another cold boot
    with the same risk.
  related:
    - ubertooth-test-harness#141
    - ubertooth#863

